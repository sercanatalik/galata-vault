# Every published crate on crates.io, from one `cargo publish --workspace`,
# started by the `v<version>` tag (RELEASING.md).
#
# Cargo resolves the order of the ten crates itself and waits for each to
# appear in the index before the next one needs it, so there is no
# hand-maintained dependency list here and none in RELEASING.md. The three
# crates marked `publish = false` -- gv-py, gv-adversary, gv-conformance --
# are skipped by `--workspace` without being named.
#
# No stored token: the credential is this workflow's OIDC identity, which is
# why the trusted publisher on each crate names this repository, this file
# and the `release` environment.
#
# Actions are pinned to commit SHAs, per RELEASING.md.

name: crates

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package and verify without uploading"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: cargo publish --workspace
    runs-on: ubuntu-24.04
    # The environment the trusted publishers name. Deployments are restricted
    # to `v*` tags: pushing the tag is the decision, so there is nothing to
    # approve afterwards.
    environment: release
    permissions:
      # The credential itself. Nothing is stored.
      id-token: write
    # Two releases must not upload at once.
    concurrency:
      group: crates-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The toolchain comes from rust-toolchain.toml, as everywhere else.
      - name: The tag and the tree must name the same version
        if: github.event_name == 'push'
        env:
          GV_EXPECT_VERSION: ${{ github.ref_name }}
        run: |
          GV_EXPECT_VERSION="${GV_EXPECT_VERSION#v}" scripts/check-version.sh

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      # --locked: the lockfile in the tag is the one that was tested.
      # cargo verifies each package by building it before upload.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CARGO_TERM_COLOR: always
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            cargo publish --workspace --locked --dry-run
          else
            cargo publish --workspace --locked
          fi
