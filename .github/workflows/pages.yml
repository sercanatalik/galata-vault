# The project's website, published to GitHub Pages at
# https://sercanatalik.github.io/galata-vault/ on every push to main, as
# site/README.md says.
#
# site/build.sh does the work: stage.py mirrors the repository's Markdown
# under site/_src (so every relative link between documents keeps working),
# mdbook builds the book into _build/docs, and the landing page and logo are
# copied beside it. Nothing about the site is generated anywhere else.
#
# A pull request builds but does not deploy. That is worth its minute:
# stage.py fails on a link to a document that is not in the tree, so a
# README that grows a dead link is caught here as well as by
# scripts/check-links.sh.
#
# Actions are pinned to commit SHAs, per RELEASING.md.

name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one half-way: a cancelled
# deploy can leave the site on a partial upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # python3 is on the runner; mdbook is not.
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2
        with:
          tool: mdbook

      - name: Build
        run: ./site/build.sh

      # Deploys only. This asks the Pages API about the site, so on a pull
      # request it fails for a repository where Pages is not enabled -- while
      # the build above, which is the whole point of running on a pull
      # request, has already passed. Nothing here consumes its outputs either:
      # book.toml sets `site-url` itself.
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # Uploaded on a pull request too, so the built site can be downloaded
      # and looked at before it is published.
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/_build

  deploy:
    name: Deploy to Pages
    # Pushes and manual runs only: a fork's pull request must not be able to
    # publish, and it could not be given the token to try.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
