# The crates on crates.io, through release-plz (RELEASING.md, release-plz.toml).
#
# Two jobs, both on a push to main:
#
#   release-pr  keeps a pull request open with the next version and the
#               changelog entry. Nothing is published by it.
#   release     publishes every crate whose version is not on crates.io yet,
#               and pushes `v<version>` -- which is what starts dist
#               (release.yml) and the wheels (wheels.yml).
#
# The `release` job runs in the `release` environment, whose required reviewer
# is the gate: a merge does not publish until a maintainer approves it.
#
# RELEASE_PLZ_TOKEN is a GitHub App or fine-grained token with contents and
# pull requests write on this repository. The default GITHUB_TOKEN cannot be
# used: a tag pushed with it starts no workflow, so dist and the wheels would
# never run.
#
# crates.io credentials: a stored CARGO_REGISTRY_TOKEN for now, because
# trusted publishing cannot create a crate and none of these names exist yet.
# The `release` job below says what to change once they do.
#
# Actions are pinned to commit SHAs, per RELEASING.md.

name: release-plz

on:
  push:
    branches: [main]
  # Recovering from a partial publish: a rerun skips versions already on
  # crates.io and continues (RELEASING.md).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-pr:
    name: Release pull request
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    # Two of these must not race on the same branch.
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # release-plz reads the history to work out what changed.
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Create or update the release pull request
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  release:
    name: Publish to crates.io
    runs-on: ubuntu-24.04
    # A maintainer approves this environment; nothing reaches crates.io before
    # that. The crates.io trusted publisher names it.
    environment: release
    permissions:
      contents: write
      # No `id-token: write`: nothing here uses OIDC while the crates.io
      # credential is a stored token. It goes back when the auth action does.
    concurrency:
      group: release-plz-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      # A stored CARGO_REGISTRY_TOKEN, because trusted publishing cannot
      # create a crate and none of these names exist on crates.io yet
      # (RELEASING.md, "The first release"). Once every crate exists, register
      # the trusted publisher -- this repository, this workflow, environment
      # `release` -- then delete the secret and put back:
      #
      #   - uses: rust-lang/crates-io-auth-action@c6f97d4  # v1
      #     id: auth
      #   ...
      #     CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      #
      # A long-lived token in a secret is the weaker arrangement of the two:
      # it does not expire on its own and it is not bound to this workflow.
      # The `release` environment's required reviewer is what stands in for
      # that binding in the meantime.
      - name: Publish, and tag the release
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
