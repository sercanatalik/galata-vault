[package]
name = "galata-vault-keys"
description = "galata-vault key tree: owner, token and writer keys, owner-signed bundles, the children record and the name key. Cannot decrypt a secret value. Implementation detail of galata-vault: depend on `galata-vault`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["galata-vault", "hkdf", "key-derivation", "e2ee", "secrets"]
categories = ["cryptography"]
# Sources, the README and the licence text only: tests and fixtures that
# read the repository (testdata/, docs/spec/) stay in the workspace.
# scripts/check-packaging.sh checks the list and the licence copies.
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE-MIT"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
# The private test-vector runner (`galata_vault_keys::vectors`): pure, holds no key
# between calls, does no I/O. The vector tests and the Python wheel enable it.
vectors = ["dep:serde_json", "galata-vault-proto/vectors"]

[dependencies]
galata-vault-proto.workspace = true
serde_json = { workspace = true, optional = true }
chacha20poly1305.workspace = true
crypto_box.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
hkdf.workspace = true
hmac.workspace = true
sha2.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
galata-vault-keys = { path = ".", features = ["vectors"] }
hex.workspace = true
proptest.workspace = true
serde.workspace = true
serde_json.workspace = true
