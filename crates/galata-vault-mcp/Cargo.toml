[package]
name = "galata-vault-mcp"
description = "A metadata-only MCP server (`gv-mcp`) for galata-vault over stdio. Links no value-decryption code, by construction."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["mcp", "secrets", "galata-vault", "e2ee"]
categories = ["command-line-utilities", "development-tools"]
# Sources, the README and the licence text only: tests and fixtures that
# read the repository (testdata/, docs/spec/) stay in the workspace.
# scripts/check-packaging.sh checks the list and the licence copies.
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE-MIT"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# dist (dist-workspace.toml): Linux and macOS only.
[package.metadata.dist]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]

[lints]
workspace = true

# The package is galata-vault-mcp; the binary keeps its name.
[[bin]]
name = "gv-mcp"
path = "src/main.rs"

# Workspace dependencies are exactly galata-vault-proto, galata-vault-keys and galata-vault-client (the
# shared transport, which itself links no value crypto); the linkage guard
# (scripts/check-mcp-linkage.sh) fails the build otherwise, and fails it if
# galata-vault-seal or age appears at any depth.
[dependencies]
galata-vault-proto.workspace = true
galata-vault-keys.workspace = true
galata-vault-client = { workspace = true, features = ["http"] }
anyhow.workspace = true
rlimit.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "rt"] }
toml.workspace = true
zeroize.workspace = true

# Tests build real vaults with real ciphertext against a real server. Dev
# edges never reach the binary, and the guard reads normal edges only.
[dev-dependencies]
# A plain HTTP client for the tests' own requests (dev only: the binary
# talks through galata-vault-client).
ureq.workspace = true
galata-vault-seal.workspace = true
# The malicious-server harness (tests/adversary.rs), and the owner core that
# sets its vaults up.
gv-adversary = { path = "../gv-adversary" }
galata-vault = { workspace = true, features = ["test-util"] }
galata-vault-server = { path = "../galata-vault-server" }
galata-vault-store.workspace = true
axum.workspace = true
tempfile.workspace = true
