[package]
name = "galata-vault-seal"
description = "galata-vault secret-value encryption (age v1), signed records and rotation batches. Client-only. Implementation detail of galata-vault: depend on `galata-vault`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["galata-vault", "age", "encryption", "e2ee", "secrets"]
categories = ["cryptography"]
# Sources, the README and the licence text only: tests and fixtures that
# read the repository (testdata/, docs/spec/) stay in the workspace.
# scripts/check-packaging.sh checks the list and the licence copies.
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE-MIT"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
# The private test-vector runner (`galata_vault_seal::vectors`): pure, holds no key
# between calls, does no I/O. The vector tests and the Python wheel enable it.
vectors = ["dep:serde_json", "galata-vault-proto/vectors", "galata-vault-keys/vectors"]

[dev-dependencies]
galata-vault-seal = { path = ".", features = ["vectors"] }
hex.workspace = true
proptest.workspace = true
serde.workspace = true
serde_json.workspace = true

[dependencies]
galata-vault-proto.workspace = true
serde_json = { workspace = true, optional = true }
galata-vault-keys.workspace = true
age.workspace = true
bech32.workspace = true
thiserror.workspace = true
zeroize.workspace = true
