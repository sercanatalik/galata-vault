[package]
name = "galata-vault-server"
description = "The galata-vault HTTP server (`gv-server`): an axum shell over galata-vault-server-core. Stores ciphertext it cannot read; links no decryption code, by construction."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["galata-vault", "server", "secrets", "e2ee"]
categories = ["web-programming::http-server", "cryptography"]
# Sources, the README and the licence text only: tests and fixtures that
# read the repository (testdata/, docs/spec/) stay in the workspace.
# scripts/check-packaging.sh checks the list and the licence copies.
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE-MIT"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# dist (dist-workspace.toml): Linux and macOS only.
[package.metadata.dist]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]

[lints]
workspace = true

# The package is galata-vault-server; the binary keeps its name.
[[bin]]
name = "gv-server"
path = "src/main.rs"

[dependencies]
galata-vault-proto.workspace = true
galata-vault-store.workspace = true
galata-vault-server-core.workspace = true
anyhow.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Tests act as real clients, so they link the client crypto. Dev-dependencies
# never reach the shipped binary, and the linkage guard reads normal edges only.
[dev-dependencies]
galata-vault-keys.workspace = true
galata-vault-seal.workspace = true
http-body-util.workspace = true
tempfile.workspace = true
tower.workspace = true
zeroize.workspace = true
