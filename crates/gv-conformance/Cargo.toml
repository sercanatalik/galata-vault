[package]
name = "gv-conformance"
description = "The black-box conformance suite for galata-vault protocol servers, over HTTP or the SDK's embedded backend (docs/spec/README.md#6)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# A test tool: not published; revisit after 1.0.
publish = false

[lints]
workspace = true

# The embedded target (`--embedded <dir>`) links the SDK's in-process
# backend, and so the server_core and backend modules. It is opt-in: Cargo unifies
# features across the workspace, so enabling galata-vault/embedded here by
# default would put the server core into every workspace build of the SDK,
# which scripts/check-sdk-linkage.sh forbids. scripts/conformance.sh and
# check-all build with it.
[features]
embedded = ["galata-vault/embedded"]

[[bin]]
name = "gv-conformance"
path = "src/main.rs"

# A client: the SDK for owner and token operations (its test-util harness
# for raw per-vault access, its embedded backend for the second target), the
# key and value crates to craft records a well-behaved client would never
# send, and ureq for the HTTP-only checks on headers and query strings.
[dependencies]
galata-vault = { workspace = true, features = ["test-util"] }
serde_json.workspace = true
ureq.workspace = true

[dev-dependencies]
galata-vault = { workspace = true, features = ["server", "embedded", "test-util"] }
axum.workspace = true
tokio.workspace = true
tempfile.workspace = true
