[package]
name = "gv-py"
description = "The galata-vault Python package: a token client and the bundled gv command."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Ships to PyPI as `galata-vault` (maturin), never to crates.io.
publish = false

# PyO3's macros expand to unsafe code, so the workspace's `forbid` cannot
# apply here; this crate writes none itself.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[lib]
crate-type = ["cdylib"]

# A client: every vault operation is the galata-vault SDK's; galata-vault-cli is here
# only for the bundled `gv` command. The server and MCP linkage guards are
# unaffected.
[dependencies]
# `vectors`: the private `_vectors` runner ships in the wheel.
galata-vault = { workspace = true, features = ["vectors"] }
serde_json.workspace = true
# `ui` on: the wheel's `gv` keeps `gv ui` (galata-vault-cli has it off by default).
galata-vault-cli = { path = "../galata-vault-cli", features = ["ui"] }
galata-vault-proto.workspace = true
pyo3.workspace = true
zeroize.workspace = true
